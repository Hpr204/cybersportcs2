            height: 100%;

            position: absolute;
            background: rgba(255, 255, 255, 0.3);
        }

        .crosshair::before {
            width: 2px;
            height: 20px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .crosshair::after {
            width: 20px;
            height: 2px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .logo-ring {
            position: absolute;
            top: -3px;
            left: -3px;
            right: -3px;
            bottom: -3px;

            border-top: 2px solid #ffd700;
            border-right: 2px solid #ff8c00;
            border-radius: 50%;

            to { transform: rotate(360deg); }

        @media (max-width: 700px) {

                flex-direction: column;
                gap: 15px;
                align-items: flex-start;
            }
            .streamer-viewers {
                align-self: flex-end;
            }
        }
    </style>
</head>

        // Функция для обновления счёта и карт
        function updateMatches() {
            matches.forEach(match => {
                if (match.isLive && Math.random() > 0.6) {
                    // Случайно увеличиваем счёт
                    if (Math.random() > 0.5) {
                        match.score1++;
                    } else {
                        match.score2++;
                    }
                    
                    // Проверяем, не закончилась ли карта (достигли 13)
                    if (match.score1 >= 13 || match.score2 >= 13) {
                        // Сохраняем результат текущей карты
                        const mapResult = `${match.score1}:${match.score2}`;
                        match.mapScores.push({ [`map${match.currentMap}`]: mapResult });
                        
                        // Начинаем новую карту, если не последняя
                        if (match.currentMap < match.totalMaps) {
                            match.currentMap++;
                            match.score1 = 0;
                            match.score2 = 0;
                        }
                    }
                }
            });
        }

        // Отображение матчей
        function displayMatches() {
            const container = document.getElementById('matchesContainer');
            
            container.innerHTML = matches.map(match => {
                // Формируем текст карты
                const mapText = match.currentMap <= match.totalMaps 
                    ? `Карта ${match.currentMap}/${match.totalMaps}` 
                    : `Матч завершён`;
                
                // Создаём историю карт
                const mapHistory = match.mapScores.map((score, index) => {
                    const mapNum = index + 1;
                    return `Карта ${mapNum}: ${Object.values(score)[0]}`;
                }).join(' • ');
                
                return `
                    <div class="match-card ${match.isLive ? 'live' : ''}">
                        ${match.isLive ? '<div class="match-status">LIVE</div>' : ''}
                        <div class="match-tournament">
                            <i class="fas fa-trophy"></i> ${match.tournament}
                        </div>
                        <div class="match-teams">
                            <div class="team">
                                <span class="team-name">${match.team1}</span>
                                <span class="team-score">${match.score1}</span>
                            </div>
                            <span class="vs">VS</span>
                            <div class="team">
                                <span class="team-name">${match.team2}</span>
                                <span class="team-score">${match.score2}</span>
                            </div>
                        </div>
                        <div class="match-info">
                            <span>
                                <i class="fas fa-map"></i> ${mapText}
                            </span>
                            <a href="https://www.hltv.org/matches" target="_blank" class="match-link">
                                Смотреть <i class="fas fa-arrow-right"></i>
                            </a>
                        </div>
                        ${match.mapScores.length > 0 ? `
                            <div style="font-size: 11px; color: rgba(255,255,255,0.3); margin-top: 10px; border-top: 1px dashed rgba(255,215,0,0.1); padding-top: 10px;">
                                <i class="fas fa-history"></i> ${mapHistory}
                            </div>
                        ` : ''}
                    </div>
                `;
            }).join('');
        }

        // Отображение стримеров
        function displayStreamers() {
            const container = document.getElementById('streamersContainer');
            
            container.innerHTML = streamers.map(streamer => {
                const initials = streamer.name.substring(0, 2).toUpperCase();
                
                return `
                    <a href="${streamer.url}" target="_blank" class="streamer-card">
                        <div class="streamer-content">
                            <div class="streamer-info">
                                <div class="streamer-avatar">${initials}</div>
                                <div class="streamer-details">
                                    <div class="streamer-name">
                                        ${streamer.name}
                                        <i class="fas fa-external-link-alt"></i>
                                    </div>
                                    <div class="streamer-meta">
                                        <span><i class="fab fa-twitch"></i> Twitch</span>
                                        <span><i class="fas fa-${streamer.type.includes('Официальная') ? 'tower-broadcast' : 'gamepad'}"></i> ${streamer.type}</span>
                                    </div>
                                </div>
                            </div>
                            <div class="streamer-viewers">
                                <i class="fas fa-circle"></i>
                                <span>${streamer.viewers.toLocaleString()} зрителей</span>
                            </div>
                        </div>
                    </a>
                `;
            }).join('');
        }

        // Запуск
        displayMatches();
        displayStreamers();

        // Обновление каждые 30 секунд
        setInterval(() => {
            updateMatches();
            displayMatches();
        }, 30000);
    </script>
</body>
</html>
