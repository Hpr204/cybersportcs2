<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS2 МАТЧИ | Реальные матчи с CyberScore</title>
    
    <!-- ВАША УНИКАЛЬНАЯ ИКОНКА -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='url(%23grad)'/><text x='50' y='70' font-size='50' text-anchor='middle' fill='%230a0c0f' font-weight='900'>H2</text><defs><linearGradient id='grad'><stop offset='0%25' stop-color='%23ffd700'/><stop offset='100%25' stop-color='%23ff8c00'/></linearGradient></defs></svg>">
    
    <!-- Шрифты -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0a0c0f;
            color: #fff;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 30%, rgba(255, 215, 0, 0.05) 0%, transparent 50%),
                        radial-gradient(circle at 80% 70%, rgba(255, 140, 0, 0.05) 0%, transparent 50%);
            pointer-events: none;
            z-index: -1;
        }

        .wrapper {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        /* ВАША ШАПКА С АНИМИРОВАННЫМ ЛОГОТИПОМ */
        header {
            background: rgba(10, 12, 15, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            padding: 15px 40px;
            margin: 20px 0 40px 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 20px;
            transition: all 0.3s ease;
        }

        header:hover {
            transform: translateY(-5px);
            border-color: rgba(255, 215, 0, 0.4);
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.6);
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .custom-logo {
            width: 60px;
            height: 60px;
            position: relative;
            margin-right: 5px;
        }

        .logo-circle {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 20px rgba(255, 215, 0, 0.5); }
            50% { box-shadow: 0 0 30px rgba(255, 215, 0, 0.8); }
            100% { box-shadow: 0 0 20px rgba(255, 215, 0, 0.5); }
        }

        .logo-text {
            color: #0a0c0f;
            font-size: 28px;
            font-weight: 900;
            letter-spacing: -2px;
            z-index: 2;
        }

        .logo-highlight {
            color: #fff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        .crosshair {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
        }

        .crosshair::before,
        .crosshair::after {
            content: '';
            position: absolute;
            background: rgba(255, 255, 255, 0.3);
        }

        .crosshair::before {
            width: 2px;
            height: 20px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .crosshair::after {
            width: 20px;
            height: 2px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .logo-ring {
            position: absolute;
            top: -3px;
            left: -3px;
            right: -3px;
            bottom: -3px;
            border: 2px solid transparent;
            border-top: 2px solid #ffd700;
            border-right: 2px solid #ff8c00;
            border-radius: 50%;
            animation: spin 3s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        header h1 {
            font-size: 36px;
            font-weight: 800;
            background: linear-gradient(135deg, #ffd700, #ff8c00, #ffd700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-size: 200% auto;
            animation: shine 3s linear infinite;
            letter-spacing: 2px;
        }

        @keyframes shine {
            to { background-position: 200% center; }
        }

        nav {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            align-items: center;
        }

        nav a {
            text-decoration: none;
            color: #fff;
            font-weight: 500;
            transition: all 0.3s;
            font-size: 16px;
            opacity: 0.7;
            position: relative;
            padding: 5px 0;
        }

        nav a::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, #ffd700, #ff8c00);
            transition: width 0.3s ease;
        }

        nav a:hover {
            opacity: 1;
            color: #ffd700;
        }

        nav a:hover::after {
            width: 100%;
        }

        nav a.active {
            color: #ffd700;
            opacity: 1;
        }

        nav a.active::after {
            width: 100%;
        }

        .page-header {
            text-align: center;
            margin: 40px 0;
        }

        .page-header h2 {
            font-size: 48px;
            font-weight: 800;
            background: linear-gradient(135deg, #ffd700, #ff8c00, #ffd700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-size: 200% auto;
            animation: shine 3s linear infinite;
            margin-bottom: 10px;
        }

        .page-header p {
            color: rgba(255, 255, 255, 0.6);
            font-size: 16px;
        }

        .api-badge {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: rgba(46, 204, 113, 0.1);
            padding: 8px 20px;
            border-radius: 50px;
            margin-top: 15px;
            border: 1px solid #2ecc71;
            color: #2ecc71;
            font-size: 14px;
        }

        .matches-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 25px;
            margin: 40px 0;
        }

        .match-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 25px;
            padding: 25px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }

        .match-card:hover {
            transform: translateY(-10px) scale(1.02);
            border-color: rgba(255, 215, 0, 0.3);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .match-card.live {
            border-left: 4px solid #ff4444;
            background: rgba(255, 68, 68, 0.05);
        }

        .match-status {
            position: absolute;
            top: 15px;
            right: 15px;
            background: #ff4444;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            animation: pulse 1.5s infinite;
        }

        .match-tournament {
            color: #ffd700;
            font-size: 14px;
            margin-bottom: 15px;
            padding-right: 60px;
            font-weight: 500;
        }

        .match-teams {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 20px 0;
        }

        .team {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            width: 40%;
        }

        .team-name {
            font-size: 18px;
            font-weight: 700;
            text-align: center;
            color: #fff;
        }

        .team-score {
            font-size: 32px;
            font-weight: 800;
            color: #ffd700;
        }

        .vs {
            color: rgba(255, 255, 255, 0.3);
            font-weight: 700;
            font-size: 18px;
        }

        .match-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 14px;
            border-top: 1px solid rgba(255, 215, 0, 0.1);
            padding-top: 15px;
        }

        .match-info i {
            color: #ffd700;
            margin-right: 5px;
        }

        .match-link {
            color: #ffd700;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .match-link:hover {
            gap: 10px;
            text-decoration: underline;
        }

        .loading {
            text-align: center;
            padding: 60px;
            grid-column: 1 / -1;
        }

        .loading i {
            font-size: 48px;
            color: #ffd700;
            margin-bottom: 20px;
        }

        .no-matches {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 30px;
            border: 1px dashed rgba(255, 215, 0, 0.3);
        }

        .no-matches i {
            font-size: 48px;
            color: #ffd700;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        footer {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            padding: 40px;
            margin-top: 50px;
            text-align: center;
        }

        footer p {
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 20px;
        }

        .social-links {
            display: flex;
            gap: 25px;
            justify-content: center;
        }

        .social-links a {
            color: rgba(255, 255, 255, 0.6);
            font-size: 24px;
            transition: all 0.3s;
        }

        .social-links a:hover {
            color: #ffd700;
            transform: translateY(-5px);
        }

        @media (max-width: 700px) {
            header {
                flex-direction: column;
                text-align: center;
            }
            nav {
                justify-content: center;
            }
            .page-header h2 {
                font-size: 36px;
            }
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <!-- ВАША ШАПКА -->
        <header>
            <div class="logo-container">
                <div class="custom-logo">
                    <div class="logo-circle">
                        <span class="logo-text">H<span class="logo-highlight">2</span></span>
                        <div class="crosshair"></div>
                    </div>
                    <div class="logo-ring"></div>
                </div>
                <h1>CS2 HUB</h1>
            </div>
            <nav>
                <a href="https://hpr204.github.io/cs2/">Главная</a>
                <a href="https://hpr204.github.io/cs2newsw/">Новости</a>
                <a href="https://hpr204.github.io/Gaidivcs2/">Гайды</a>
                <a href="https://hpr204.github.io/top10/">Топ-10</a>
            </nav>
        </header>

        <!-- ЗАГОЛОВОК -->
        <div class="page-header">
            <h2>🎯 LIVE МАТЧИ CS2</h2>
            <div class="api-badge">
                <i class="fas fa-database"></i>
                <span>Данные с CyberScore (обновление каждые 30 сек)</span>
            </div>
        </div>

        <!-- КОНТЕЙНЕР ДЛЯ МАТЧЕЙ -->
        <div id="matchesContainer" class="matches-grid">
            <div class="loading">
                <i class="fas fa-spinner fa-spin"></i>
                <p>Загрузка реальных матчей...</p>
            </div>
        </div>

        <!-- ССЫЛКА НА HLTV (на всякий случай) -->
        <div style="text-align: center; margin: 20px 0;">
            <a href="https://www.hltv.org/matches" target="_blank" style="color: #ffd700; text-decoration: none;">
                <i class="fas fa-external-link-alt"></i> Все матчи на HLTV.org
            </a>
        </div>

        <!-- ФУТЕР -->
        <footer>
            <p>© 2026 CS2 HUB - Реальные данные с CyberScore</p>
            <div class="social-links">
                <a href="#"><i class="fab fa-discord"></i></a>
                <a href="#"><i class="fab fa-telegram"></i></a>
                <a href="#"><i class="fab fa-twitch"></i></a>
                <a href="#"><i class="fab fa-youtube"></i></a>
                <a href="#"><i class="fab fa-steam"></i></a>
            </div>
        </footer>
    </div>

    <script>
        async function loadMatches() {
            const container = document.getElementById('matchesContainer');
            
            try {
                // CyberScore API - не требует ключа
                const response = await fetch('https://api.cyberscore.live/api/v1/csgo/matches');
                const data = await response.json();
                
                if (!data || data.length === 0) {
                    container.innerHTML = `
                        <div class="no-matches">
                            <i class="fas fa-info-circle"></i>
                            <h3>Нет live матчей</h3>
                            <p>На данный момент нет активных матчей</p>
                        </div>
                    `;
                    return;
                }

                // Фильтруем только live матчи
                const liveMatches = data.filter(match => 
                    match.status === 'live' || match.status === 'running'
                );

                if (liveMatches.length === 0) {
                    container.innerHTML = `
                        <div class="no-matches">
                            <i class="fas fa-info-circle"></i>
                            <h3>Нет live матчей</h3>
                            <p>На данный момент нет активных матчей</p>
                        </div>
                    `;
                    return;
                }

                // Показываем матчи
                container.innerHTML = liveMatches.map(match => {
                    const team1 = match.team1?.name || 'TBD';
                    const team2 = match.team2?.name || 'TBD';
                    const score1 = match.score1 || 0;
                    const score2 = match.score2 || 0;
                    const tournament = match.tournament?.name || match.league?.name || 'Live матч';
                    
                    return `
                        <div class="match-card live">
                            <div class="match-status">LIVE</div>
                            <div class="match-tournament">
                                <i class="fas fa-trophy"></i> ${tournament}
                            </div>
                            <div class="match-teams">
                                <div class="team">
                                    <span class="team-name">${team1}</span>
                                    <span class="team-score">${score1}</span>
                                </div>
                                <span class="vs">VS</span>
                                <div class="team">
                                    <span class="team-name">${team2}</span>
                                    <span class="team-score">${score2}</span>
                                </div>
                            </div>
                            <div class="match-info">
                                <span><i class="fas fa-circle" style="color: #ff4444;"></i> LIVE</span>
                                <a href="https://www.hltv.org/matches" target="_blank" class="match-link">
                                    Смотреть <i class="fas fa-arrow-right"></i>
                                </a>
                            </div>
                        </div>
                    `;
                }).join('');

            } catch (error) {
                console.error('Ошибка:', error);
                container.innerHTML = `
                    <div class="no-matches">
                        <i class="fas fa-exclamation-triangle"></i>
                        <h3>Ошибка загрузки</h3>
                        <p>Не удалось получить данные. Попробуйте позже.</p>
                    </div>
                `;
            }
        }

        // Загружаем сразу
        loadMatches();

        // Обновляем каждые 30 секунд
        setInterval(loadMatches, 30000);
    </script>
</body>
</html>
