<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS2 МАТЧИ | Расписание IEM Cologne 2026</title>
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='url(%23grad)'/><text x='50' y='70' font-size='50' text-anchor='middle' fill='%230a0c0f' font-weight='900'>H2</text><defs><linearGradient id='grad'><stop offset='0%25' stop-color='%23ffd700'/><stop offset='100%25' stop-color='%23ff8c00'/></linearGradient></defs></svg>">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0a0c0f;
            color: #fff;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 30%, rgba(255, 215, 0, 0.05) 0%, transparent 50%),
                        radial-gradient(circle at 80% 70%, rgba(255, 140, 0, 0.05) 0%, transparent 50%);
            pointer-events: none;
            z-index: -1;
        }

        .wrapper {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            background: rgba(10, 12, 15, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            padding: 15px 40px;
            margin: 20px 0 40px 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 20px;
            transition: all 0.3s ease;
        }

        header:hover {
            transform: translateY(-5px);
            border-color: rgba(255, 215, 0, 0.4);
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 15px;
            text-decoration: none;
            cursor: pointer;
        }

        .custom-logo {
            width: 60px;
            height: 60px;
            position: relative;
        }

        .logo-circle {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 20px rgba(255, 215, 0, 0.5); }
            50% { box-shadow: 0 0 30px rgba(255, 215, 0, 0.8); }
            100% { box-shadow: 0 0 20px rgba(255, 215, 0, 0.5); }
        }

        .logo-text {
            color: #0a0c0f;
            font-size: 28px;
            font-weight: 900;
            letter-spacing: -2px;
        }

        .logo-highlight {
            color: #fff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        .logo-ring {
            position: absolute;
            top: -3px;
            left: -3px;
            right: -3px;
            bottom: -3px;
            border: 2px solid transparent;
            border-top: 2px solid #ffd700;
            border-right: 2px solid #ff8c00;
            border-radius: 50%;
            animation: spin 3s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        header h1 {
            font-size: 36px;
            font-weight: 800;
            background: linear-gradient(135deg, #ffd700, #ff8c00, #ffd700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-size: 200% auto;
            animation: shine 3s linear infinite;
        }

        @keyframes shine {
            to { background-position: 200% center; }
        }

        nav {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
        }

        nav a {
            text-decoration: none;
            color: #fff;
            font-weight: 500;
            transition: all 0.3s;
            opacity: 0.7;
            position: relative;
            padding: 5px 0;
        }

        nav a::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, #ffd700, #ff8c00);
            transition: width 0.3s ease;
        }

        nav a:hover {
            opacity: 1;
            color: #ffd700;
        }

        nav a:hover::after {
            width: 100%;
        }

        nav a.active {
            color: #ffd700;
            opacity: 1;
        }

        nav a.active::after {
            width: 100%;
        }

        .page-header {
            text-align: center;
            margin: 40px 0;
        }

        .page-header h2 {
            font-size: 48px;
            font-weight: 800;
            background: linear-gradient(135deg, #ffd700, #ff8c00, #ffd700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-size: 200% auto;
            animation: shine 3s linear infinite;
            margin-bottom: 10px;
        }

        .matches-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 25px;
            margin: 40px 0;
        }

        .match-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 25px;
            padding: 25px;
            transition: all 0.4s;
            position: relative;
            overflow: hidden;
        }

        .match-card:hover {
            transform: translateY(-5px);
            border-color: rgba(255, 215, 0, 0.3);
        }

        .match-tournament {
            color: #ffd700;
            font-size: 14px;
            margin-bottom: 15px;
            padding-right: 60px;
            font-weight: 500;
        }

        .match-teams {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 20px 0;
        }

        .team {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            width: 40%;
        }

        .team-name {
            font-size: 18px;
            font-weight: 700;
            text-align: center;
        }

        .vs {
            color: rgba(255, 255, 255, 0.3);
            font-weight: 700;
            font-size: 18px;
        }

        .match-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 14px;
            border-top: 1px solid rgba(255, 215, 0, 0.1);
            padding-top: 15px;
        }

        .match-info i {
            color: #ffd700;
            margin-right: 5px;
        }

        .match-link {
            color: #ffd700;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s;
        }

        .match-link:hover {
            text-decoration: underline;
        }

        .tournaments-section {
            margin: 60px 0 40px;
        }

        .section-title {
            font-size: 32px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 30px;
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .tournaments-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }

        .tournament-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 215, 0, 0.15);
            border-radius: 20px;
            padding: 20px;
            transition: all 0.3s;
            text-align: center;
        }

        .tournament-card:hover {
            transform: translateY(-5px);
            border-color: rgba(255, 215, 0, 0.4);
            background: rgba(255, 255, 255, 0.06);
        }

        .tournament-name {
            font-size: 20px;
            font-weight: 700;
            color: #ffd700;
            margin-bottom: 12px;
        }

        .tournament-dates {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 8px;
        }

        .tournament-prize {
            font-size: 13px;
            color: #ff8c00;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .tournament-link {
            color: #fff;
            text-decoration: none;
            font-size: 14px;
            border: 1px solid rgba(255, 215, 0, 0.3);
            padding: 6px 16px;
            border-radius: 30px;
            transition: all 0.3s;
            display: inline-block;
        }

        .tournament-link:hover {
            background: rgba(255, 215, 0, 0.2);
            border-color: #ffd700;
        }

        footer {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 40px;
            margin-top: 50px;
            text-align: center;
        }

        .social-links {
            display: flex;
            gap: 25px;
            justify-content: center;
            margin-top: 20px;
        }

        .social-links a {
            color: rgba(255, 255, 255, 0.6);
            font-size: 24px;
            transition: all 0.3s;
        }

        .social-links a:hover {
            color: #ffd700;
            transform: translateY(-5px);
        }

        @media (max-width: 700px) {
            header {
                flex-direction: column;
                text-align: center;
            }
            .page-header h2 {
                font-size: 32px;
            }
            .section-title {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <header>
            <a href="https://hpr204.github.io/cs2/" class="logo-container">
                <div class="custom-logo">
                    <div class="logo-circle">
                        <span class="logo-text">H<span class="logo-highlight">2</span></span>
                    </div>
                    <div class="logo-ring"></div>
                </div>
                <h1>CS2 HUB</h1>
            </a>
            <nav>
                <a href="https://hpr204.github.io/cs2/">Главная</a>
                <a href="https://hpr204.github.io/cs2newsw/">Новости</a>
                <a href="https://hpr204.github.io/Gaidivcs2/">Гайды</a>
                <a href="https://hpr204.github.io/top10/">Топ-10</a>
                <a href="schedule.html" class="active">Матчи</a>
            </nav>
        </header>

        <div class="page-header">
            <h2>РАСПИСАНИЕ МАТЧЕЙ CS2</h2>
        </div>

        <div id="matchesContainer" class="matches-grid"></div>

        <div class="tournaments-section">
            <div class="section-title">
                <i class="fas fa-globe-americas"></i>
                ОСТАВШИЕСЯ ТУРНИРЫ TIER-1 2026
                <i class="fas fa-trophy"></i>
            </div>
            <div class="tournaments-grid" id="tournamentsContainer"></div>
        </div>

        <footer>
            <p>© 2026 CS2 HUB • Расписание IEM Cologne Major 2026 (источник: HLTV.org)</p>
            <div class="social-links">
                <a href="#" target="_blank"><i class="fab fa-discord"></i></a>
                <a href="#" target="_blank"><i class="fab fa-telegram"></i></a>
                <a href="#" target="_blank"><i class="fab fa-twitch"></i></a>
                <a href="#" target="_blank"><i class="fab fa-youtube"></i></a>
                <a href="#" target="_blank"><i class="fab fa-steam"></i></a>
            </div>
        </footer>
    </div>

    <script>
        const realMatches = [
            { team1: "M80", team2: "Lynn Vision Gaming", time: "13:30 CET", tournament: "IEM Cologne Major 2026 • Stage 1 (Открытие)" },
            { team1: "SINNERS", team2: "FlyQuest", time: "13:30 CET", tournament: "IEM Cologne Major 2026 • Stage 1 (Открытие)" },
            { team1: "B8", team2: "TYLOO", time: "14:30 CET", tournament: "IEM Cologne Major 2026 • Stage 1 (Открытие)" },
            { team1: "MIBR", team2: "THUNDER dOWNUNDER", time: "14:30 CET", tournament: "IEM Cologne Major 2026 • Stage 1 (Открытие)" },
            { team1: "GamerLegion", team2: "NRG", time: "15:30 CET", tournament: "IEM Cologne Major 2026 • Stage 1 (Открытие)" },
            { team1: "HEROIC", team2: "Sharks Esports", time: "15:30 CET", tournament: "IEM Cologne Major 2026 • Stage 1 (Открытие)" },
            { team1: "BetBoom Team", team2: "Gaimin Gladiators", time: "16:30 CET", tournament: "IEM Cologne Major 2026 • Stage 1 (Открытие)" },
            { team1: "BIG", team2: "Team Liquid", time: "16:30 CET", tournament: "IEM Cologne Major 2026 • Stage 1 (Открытие)" }
        ];

        const tier1Tournaments = [
            { name: "ESL Pro League Season 21", dates: "8 июня – 28 июня 2026", prize: "$850,000", location: "Мальта", link: "https://www.hltv.org/events/7606/esl-pro-league-season-21" },
            { name: "BLAST Premier Fall Groups 2026", dates: "15 июля – 1 августа 2026", prize: "$190,000", location: "Копенгаген / онлайн", link: "https://www.hltv.org/events/7610/blast-premier-fall-groups-2026" },
            { name: "IEM Rio 2026", dates: "12–20 сентября 2026", prize: "$250,000", location: "Рио-де-Жанейро, Бразилия", link: "https://www.hltv.org/events/7612/iem-rio-2026" },
            { name: "ESL Pro League Season 22", dates: "1–21 октября 2026", prize: "$850,000", location: "Мальта", link: "https://www.hltv.org/events/7614/esl-pro-league-season-22" },
            { name: "BLAST Premier World Final 2026", dates: "5–9 ноября 2026", prize: "$1,000,000", location: "Абу-Даби, ОАЭ", link: "https://www.hltv.org/events/7616/blast-premier-world-final-2026" },
            { name: "IEM Katowice 2027", dates: "Январь 2027 (квалификации с декабря)", prize: "$1,000,000", location: "Катовице, Польша", link: "https://www.hltv.org/events/7618/iem-katowice-2027" }
        ];

        function renderMatches() {
            const container = document.getElementById('matchesContainer');
            container.innerHTML = realMatches.map(match => `
                <div class="match-card">
                    <div class="match-tournament"><i class="fas fa-trophy"></i> ${match.tournament}</div>
                    <div class="match-teams">
                        <div class="team"><span class="team-name">${match.team1}</span></div>
                        <span class="vs">VS</span>
                        <div class="team"><span class="team-name">${match.team2}</span></div>
                    </div>
                    <div class="match-info">
                        <span><i class="far fa-clock"></i> ${match.time}</span>
                        <a href="https://www.hltv.org/matches" target="_blank" class="match-link">Подробнее на HLTV <i class="fas fa-arrow-right"></i></a>
                    </div>
                </div>
            `).join('');
        }

        function renderTournaments() {
            const container = document.getElementById('tournamentsContainer');
            container.innerHTML = tier1Tournaments.map(t => `
                <div class="tournament-card">
                    <div class="tournament-name">${t.name}</div>
                    <div class="tournament-dates"><i class="far fa-calendar-alt"></i> ${t.dates}</div>
                    <div class="tournament-prize"><i class="fas fa-dollar-sign"></i> ${t.prize} • ${t.location}</div>
                    <a href="${t.link}" target="_blank" rel="noopener noreferrer" class="tournament-link">Подробнее на HLTV</a>
                </div>
            `).join('');
        }

        renderMatches();
        renderTournaments();
    </script>
</body>
</html>
