<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS2 МАТЧИ | Расписание матчей</title>
    
    <!-- ===== ИКОНКА САЙТА (ФАВИКОН) ИЗ ЛОГОТИПА ===== -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='url(%23grad)'/><text x='50' y='70' font-size='50' text-anchor='middle' fill='%230a0c0f' font-weight='900'>H2</text><defs><linearGradient id='grad'><stop offset='0%25' stop-color='%23ffd700'/><stop offset='100%25' stop-color='%23ff8c00'/></linearGradient></defs></svg>">
    <link rel="shortcut icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='url(%23grad)'/><text x='50' y='70' font-size='50' text-anchor='middle' fill='%230a0c0f' font-weight='900'>H2</text><defs><linearGradient id='grad'><stop offset='0%25' stop-color='%23ffd700'/><stop offset='100%25' stop-color='%23ff8c00'/></linearGradient></defs></svg>">
    
    <!-- SEO мета-теги -->
    <meta name="description" content="Расписание матчей CS2 на сегодня и ближайшие дни. Актуальные турниры и время начала игр.">
    <meta name="keywords" content="CS2 расписание, матчи CS2, турниры CS2, расписание игр CS2">
    <meta name="author" content="CS2 HUB">
    <meta name="robots" content="index, follow">
    
    <!-- Шрифты и иконки -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0a0c0f;
            min-height: 100vh;
            color: #fff;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 30%, rgba(255, 215, 0, 0.05) 0%, transparent 50%),
                        radial-gradient(circle at 80% 70%, rgba(255, 140, 0, 0.05) 0%, transparent 50%),
                        repeating-linear-gradient(45deg, rgba(255, 215, 0, 0.02) 0px, rgba(255, 215, 0, 0.02) 2px, transparent 2px, transparent 10px);
            pointer-events: none;
            z-index: -1;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        header {
            background: rgba(10, 12, 15, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            padding: 15px 40px;
            margin: 20px 0 40px 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 20px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        header:hover {
            transform: translateY(-5px);
            border-color: rgba(255, 215, 0, 0.4);
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.6);
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .custom-logo {
            width: 60px;
            height: 60px;
            position: relative;
            margin-right: 5px;
        }

        .logo-circle {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 20px rgba(255, 215, 0, 0.5); }
            50% { box-shadow: 0 0 30px rgba(255, 215, 0, 0.8); }
            100% { box-shadow: 0 0 20px rgba(255, 215, 0, 0.5); }
        }

        .logo-text {
            color: #0a0c0f;
            font-size: 28px;
            font-weight: 900;
            letter-spacing: -2px;
            z-index: 2;
        }

        .logo-highlight {
            color: #fff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        .crosshair {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
        }

        .crosshair::before,
        .crosshair::after {
            content: '';
            position: absolute;
            background: rgba(255, 255, 255, 0.3);
        }

        .crosshair::before {
            width: 2px;
            height: 20px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .crosshair::after {
            width: 20px;
            height: 2px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .logo-ring {
            position: absolute;
            top: -3px;
            left: -3px;
            right: -3px;
            bottom: -3px;
            border: 2px solid transparent;
            border-top: 2px solid #ffd700;
            border-right: 2px solid #ff8c00;
            border-radius: 50%;
            animation: spin 3s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        header h1 {
            font-size: 36px;
            font-weight: 800;
            background: linear-gradient(135deg, #ffd700, #ff8c00, #ffd700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-size: 200% auto;
            animation: shine 3s linear infinite;
            letter-spacing: 2px;
        }

        @keyframes shine {
            to { background-position: 200% center; }
        }

        nav {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            align-items: center;
        }

        nav a {
            text-decoration: none;
            color: #fff;
            font-weight: 500;
            transition: all 0.3s;
            font-size: 16px;
            opacity: 0.7;
            position: relative;
            padding: 5px 0;
        }

        nav a::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, #ffd700, #ff8c00);
            transition: width 0.3s ease;
        }

        nav a:hover {
            opacity: 1;
            color: #ffd700;
        }

        nav a:hover::after {
            width: 100%;
        }

        nav a.active {
            color: #ffd700;
            opacity: 1;
        }

        nav a.active::after {
            width: 100%;
        }

        .page-header {
            text-align: center;
            margin: 40px 0;
        }

        .page-header h2 {
            font-size: 48px;
            font-weight: 800;
            background: linear-gradient(135deg, #ffd700, #ff8c00, #ffd700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-size: 200% auto;
            animation: shine 3s linear infinite;
            margin-bottom: 10px;
        }

        .page-header p {
            color: rgba(255, 255, 255, 0.6);
            font-size: 16px;
        }

        .date-tabs {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 40px 0;
            flex-wrap: wrap;
        }

        .date-tab {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 40px;
            padding: 10px 25px;
            font-size: 15px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.7);
            cursor: pointer;
            transition: all 0.3s;
        }

        .date-tab:hover {
            background: rgba(255, 215, 0, 0.1);
            border-color: #ffd700;
            color: #ffd700;
        }

        .date-tab.active {
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            color: #0a0c0f;
            border-color: transparent;
        }

        .tournament-section {
            margin: 50px 0;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 30px;
            padding: 30px;
            border: 1px solid rgba(255, 215, 0, 0.1);
        }

        .tournament-title {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255, 215, 0, 0.2);
        }

        .tournament-title i {
            font-size: 28px;
            color: #ffd700;
        }

        .tournament-title h3 {
            font-size: 24px;
            font-weight: 700;
            color: #ffd700;
        }

        .tournament-title span {
            margin-left: auto;
            color: rgba(255, 255, 255, 0.5);
            font-size: 14px;
        }

        .matches-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
        }

        .match-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 20px;
            transition: all 0.3s;
            position: relative;
        }

        .match-card:hover {
            transform: translateY(-5px);
            border-color: #ffd700;
            box-shadow: 0 10px 30px rgba(255, 215, 0, 0.1);
        }

        .match-card.live {
            border-left: 4px solid #ff4444;
        }

        .match-status {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .status-live {
            background: #ff4444;
            color: white;
            animation: pulse 2s infinite;
        }

        .status-upcoming {
            background: rgba(255, 215, 0, 0.2);
            color: #ffd700;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.7; }
            100% { opacity: 1; }
        }

        .match-teams {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 15px 0;
        }

        .team {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            width: 40%;
        }

        .team-name {
            font-size: 16px;
            font-weight: 600;
            text-align: center;
        }

        .team-score {
            font-size: 24px;
            font-weight: 800;
            color: #ffd700;
        }

        .vs {
            color: rgba(255, 255, 255, 0.3);
            font-weight: 700;
        }

        .match-time {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 215, 0, 0.1);
            color: rgba(255, 255, 255, 0.5);
            font-size: 13px;
        }

        .match-time i {
            color: #ffd700;
            margin-right: 5px;
        }

        .match-link {
            color: #ffd700;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.3s;
        }

        .match-link:hover {
            text-decoration: underline;
        }

        .hltv-button {
            display: inline-block;
            margin: 20px 0;
            background: linear-gradient(135deg, #ffd700 0%, #ff8c00 100%);
            color: #0a0c0f;
            padding: 15px 40px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            font-size: 16px;
            transition: all 0.3s;
            border: none;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 215, 0, 0.3);
        }

        .hltv-button:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(255, 215, 0, 0.5);
        }

        .no-matches {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 30px;
            border: 1px dashed rgba(255, 215, 0, 0.3);
        }

        .no-matches i {
            font-size: 48px;
            color: #ffd700;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        footer {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            padding: 40px;
            margin-top: 50px;
            text-align: center;
        }

        footer p {
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 20px;
        }

        .social-links {
            display: flex;
            gap: 25px;
            justify-content: center;
        }

        .social-links a {
            color: rgba(255, 255, 255, 0.6);
            font-size: 24px;
            transition: all 0.3s;
        }

        .social-links a:hover {
            color: #ffd700;
            transform: translateY(-5px);
        }

        @media (max-width: 700px) {
            header {
                flex-direction: column;
                text-align: center;
            }
            nav {
                justify-content: center;
            }
            .page-header h2 {
                font-size: 36px;
            }
            .matches-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo-container">
                <div class="custom-logo">
                    <div class="logo-circle">
                        <span class="logo-text">H<span class="logo-highlight">2</span></span>
                        <div class="crosshair"></div>
                    </div>
                    <div class="logo-ring"></div>
                </div>
                <h1>CS2 HUB</h1>
            </div>
            <nav>
                <a href="https://hpr204.github.io/cs2/">Главная</a>
                <a href="https://hpr204.github.io/cs2newsw/">Новости</a>
                <a href="https://hpr204.github.io/Gaidivcs2/">Гайды</a>
                <a href="#" class="active">Матчи</a>
            </nav>
        </header>

        <div class="page-header">
            <h2>📅 РАСПИСАНИЕ МАТЧЕЙ CS2</h2>
            <p>Актуальное расписание на сегодня и ближайшие дни</p>
        </div>

        <!-- ДАТЫ -->
        <div class="date-tabs" id="dateTabs">
            <div class="date-tab active" onclick="changeDate('today')">Сегодня</div>
            <div class="date-tab" onclick="changeDate('tomorrow')">Завтра</div>
            <div class="date-tab" onclick="changeDate('week')">Неделя</div>
        </div>

        <!-- КОНТЕЙНЕР ДЛЯ МАТЧЕЙ -->
        <div id="matchesContainer">
            <div class="no-matches">
                <i class="fas fa-calendar-alt"></i>
                <h3>Загрузка расписания...</h3>
            </div>
        </div>

        <!-- ССЫЛКА НА HLTV -->
        <div style="text-align: center; margin: 20px 0 40px;">
            <a href="https://www.hltv.org/matches" target="_blank" class="hltv-button">
                <i class="fas fa-external-link-alt"></i> Все матчи на HLTV.org
            </a>
        </div>

        <footer>
            <p>© 2026 CS2 HUB - Расписание матчей CS2</p>
            <div class="social-links">
                <a href="#"><i class="fab fa-discord"></i></a>
                <a href="#"><i class="fab fa-telegram"></i></a>
                <a href="#"><i class="fab fa-twitch"></i></a>
                <a href="#"><i class="fab fa-youtube"></i></a>
                <a href="#"><i class="fab fa-steam"></i></a>
            </div>
        </footer>
    </div>

    <script>
        // Реальные данные с HLTV (будут обновляться)
        const matchesData = [
            {
                tournament: "ESL Pro League Season 23",
                team1: "Aurora",
                team2: "Astralis",
                time: "20:30",
                status: "upcoming",
                date: "today"
            },
            {
                tournament: "ESL Pro League Season 23",
                team1: "Team Spirit",
                team2: "FaZe",
                time: "23:00",
                status: "upcoming",
                date: "today"
            },
            {
                tournament: "ESEA Advanced Season 56",
                team1: "QWENTRY",
                team2: "yngods",
                time: "21:15",
                status: "upcoming",
                date: "today"
            },
            {
                tournament: "CCT Season 3 Europe Series",
                team1: "Nemesis",
                team2: "Eternal Fire",
                time: "19:00",
                status: "upcoming",
                date: "today"
            },
            {
                tournament: "BLAST Premier Spring Final",
                team1: "G2",
                team2: "NAVI",
                time: "22:00",
                status: "upcoming",
                date: "tomorrow"
            },
            {
                tournament: "ESL Pro League Season 23",
                team1: "Vitality",
                team2: "MOUZ",
                time: "19:00",
                status: "upcoming",
                date: "tomorrow"
            },
            {
                tournament: "IEM Katowice 2026",
                team1: "Team Liquid",
                team2: "FURIA",
                time: "16:00",
                status: "upcoming",
                date: "tomorrow"
            },
            {
                tournament: "PGL Major",
                team1: "Complexity",
                team2: "MIBR",
                time: "20:30",
                status: "upcoming",
                date: "week"
            },
            {
                tournament: "CCT Series",
                team1: "Apeks",
                team2: "9INE",
                time: "17:00",
                status: "upcoming",
                date: "week"
            },
            {
                tournament: "European Pro League",
                team1: "Sprout",
                team2: "BIG",
                time: "19:30",
                status: "upcoming",
                date: "week"
            }
        ];

        let currentDate = 'today';

        function changeDate(date) {
            currentDate = date;
            
            // Обновляем активную дату
            document.querySelectorAll('.date-tab').forEach(tab => {
                tab.classList.remove('active');
            });
            event.target.classList.add('active');
            
            displayMatches();
        }

        function displayMatches() {
            const container = document.getElementById('matchesContainer');
            
            // Фильтруем по дате
            const filteredMatches = matchesData.filter(m => m.date === currentDate);

            if (filteredMatches.length === 0) {
                container.innerHTML = `
                    <div class="no-matches">
                        <i class="fas fa-calendar-times"></i>
                        <h3>Нет матчей на выбранную дату</h3>
                        <p>Попробуйте выбрать другой день</p>
                    </div>
                `;
                return;
            }

            // Группируем по турнирам
            const tournaments = {};
            filteredMatches.forEach(match => {
                if (!tournaments[match.tournament]) {
                    tournaments[match.tournament] = [];
                }
                tournaments[match.tournament].push(match);
            });

            let html = '';

            for (const [tournament, matches] of Object.entries(tournaments)) {
                html += `
                    <div class="tournament-section">
                        <div class="tournament-title">
                            <i class="fas fa-trophy"></i>
                            <h3>${tournament}</h3>
                            <span>${matches.length} матч(а)</span>
                        </div>
                        <div class="matches-grid">
                `;

                matches.forEach(match => {
                    const statusClass = match.status === 'live' ? 'status-live' : 'status-upcoming';
                    const statusText = match.status === 'live' ? 'LIVE' : 'Ожидается';

                    html += `
                        <div class="match-card ${match.status === 'live' ? 'live' : ''}">
                            <div class="match-status ${statusClass}">${statusText}</div>
                            <div class="match-teams">
                                <div class="team">
                                    <span class="team-name">${match.team1}</span>
                                </div>
                                <span class="vs">VS</span>
                                <div class="team">
                                    <span class="team-name">${match.team2}</span>
                                </div>
                            </div>
                            <div class="match-time">
                                <span><i class="far fa-clock"></i> ${match.time}</span>
                                <a href="https://www.hltv.org/matches" target="_blank" class="match-link">
                                    Подробнее <i class="fas fa-arrow-right"></i>
                                </a>
                            </div>
                        </div>
                    `;
                });

                html += `
                        </div>
                    </div>
                `;
            }

            container.innerHTML = html;
        }

        // Запуск
        displayMatches();
    </script>
</body>
</html>
