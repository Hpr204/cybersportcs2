<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS2 МАТЧИ | Реальные матчи HLTV</title>
    
    <!-- ИКОНКА САЙТА -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='url(%23grad)'/><text x='50' y='70' font-size='50' text-anchor='middle' fill='%230a0c0f' font-weight='900'>H2</text><defs><linearGradient id='grad'><stop offset='0%25' stop-color='%23ffd700'/><stop offset='100%25' stop-color='%23ff8c00'/></linearGradient></defs></svg>">
    
    <!-- Шрифты -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <style>
        /* Стили как у вас на сайте */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0a0c0f;
            color: #fff;
        }

        .wrapper {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            background: rgba(10, 12, 15, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 30px;
            padding: 15px 40px;
            margin: 20px 0 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 20px;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .custom-logo {
            width: 60px;
            height: 60px;
            position: relative;
        }

        .logo-circle {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 20px rgba(255, 215, 0, 0.5); }
            50% { box-shadow: 0 0 30px rgba(255, 215, 0, 0.8); }
            100% { box-shadow: 0 0 20px rgba(255, 215, 0, 0.5); }
        }

        .logo-text {
            color: #0a0c0f;
            font-size: 28px;
            font-weight: 900;
        }

        header h1 {
            font-size: 36px;
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        nav {
            display: flex;
            gap: 30px;
            align-items: center;
        }

        nav a {
            text-decoration: none;
            color: #fff;
            font-weight: 500;
            transition: 0.3s;
            opacity: 0.7;
        }

        nav a:hover, nav a.active {
            color: #ffd700;
            opacity: 1;
        }

        .page-header {
            text-align: center;
            margin: 40px 0;
        }

        .page-header h2 {
            font-size: 48px;
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .matches-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 25px;
            margin: 40px 0;
        }

        .match-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 20px;
            transition: 0.3s;
            position: relative;
        }

        .match-card:hover {
            transform: translateY(-5px);
            border-color: #ffd700;
        }

        .match-card.live {
            border-left: 4px solid #ff4444;
        }

        .match-status {
            position: absolute;
            top: 15px;
            right: 15px;
            background: #ff4444;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            animation: pulse 1.5s infinite;
        }

        .match-tournament {
            color: #ffd700;
            font-size: 14px;
            margin-bottom: 15px;
            padding-right: 60px;
        }

        .match-teams {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 15px 0;
        }

        .team {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            width: 40%;
        }

        .team-name {
            font-size: 16px;
            font-weight: 600;
            text-align: center;
        }

        .team-score {
            font-size: 24px;
            font-weight: 800;
            color: #ffd700;
        }

        .vs {
            color: rgba(255, 255, 255, 0.3);
            font-weight: 700;
        }

        .match-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 215, 0, 0.1);
            color: rgba(255, 255, 255, 0.5);
            font-size: 13px;
        }

        .match-link {
            color: #ffd700;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            transition: 0.3s;
        }

        .match-link:hover {
            text-decoration: underline;
        }

        .hltv-button {
            display: inline-block;
            margin: 30px 0;
            background: linear-gradient(135deg, #ffd700 0%, #ff8c00 100%);
            color: #0a0c0f;
            padding: 15px 40px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            font-size: 16px;
            transition: 0.3s;
        }

        .hltv-button:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(255, 215, 0, 0.5);
        }

        .loading {
            text-align: center;
            padding: 60px;
            grid-column: 1 / -1;
        }

        .loading i {
            font-size: 48px;
            color: #ffd700;
        }

        footer {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 30px;
            padding: 40px;
            margin-top: 50px;
            text-align: center;
        }

        @media (max-width: 700px) {
            header {
                flex-direction: column;
                text-align: center;
            }
            nav {
                justify-content: center;
            }
            .page-header h2 {
                font-size: 36px;
            }
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <header>
            <div class="logo-container">
                <div class="custom-logo">
                    <div class="logo-circle">
                        <span class="logo-text">H2</span>
                    </div>
                </div>
                <h1>CS2 HUB</h1>
            </div>
            <nav>
                <a href="https://hpr204.github.io/cs2/">Главная</a>
                <a href="https://hpr204.github.io/cs2newsw/">Новости</a>
                <a href="https://hpr204.github.io/Gaidivcs2/">Гайды</a>
                <a href="#" class="active">Матчи</a>
            </nav>
        </header>

        <div class="page-header">
            <h2>🎯 LIVE МАТЧИ CS2</h2>
        </div>

        <!-- КОНТЕЙНЕР ДЛЯ МАТЧЕЙ -->
        <div id="matchesContainer" class="matches-grid">
            <div class="loading">
                <i class="fas fa-spinner fa-spin"></i>
                <p>Загрузка реальных матчей...</p>
            </div>
        </div>

        <!-- ССЫЛКА НА HLTV -->
        <div style="text-align: center;">
            <a href="https://www.hltv.org/matches" target="_blank" class="hltv-button">
                <i class="fas fa-external-link-alt"></i> Все матчи на HLTV.org
            </a>
        </div>

        <footer>
            <p>© 2026 CS2 HUB - Реальные матчи</p>
        </footer>
    </div>

    <script>
        // ИСПОЛЬЗУЕМ ГОТОВЫЙ БЕСПЛАТНЫЙ API
        async function loadMatches() {
            const container = document.getElementById('matchesContainer');
            
            try {
                // Пробуем несколько бесплатных API
                const apis = [
                    'https://hltv-api.vercel.app/api/matches.json',
                    'https://raw.githubusercontent.com/akusio/hltv-api/main/matches.json',
                    'https://api.cyberscore.live/api/v1/csgo/matches'
                ];
                
                let matches = [];
                
                for (const api of apis) {
                    try {
                        const response = await fetch(api);
                        if (response.ok) {
                            matches = await response.json();
                            break;
                        }
                    } catch (e) {
                        console.log('API не работает:', api);
                    }
                }

                if (matches.length === 0) {
                    container.innerHTML = `
                        <div style="grid-column: 1/-1; text-align: center; padding: 60px;">
                            <i class="fas fa-info-circle" style="font-size: 48px; color: #ffd700;"></i>
                            <p style="margin-top: 20px;">Нет live матчей. Попробуйте позже.</p>
                        </div>
                    `;
                    return;
                }

                // Показываем матчи
                container.innerHTML = matches
                    .filter(m => m.live || m.status === 'live' || m.status === 'running')
                    .map(match => {
                        const team1 = match.team1?.name || match.team1 || 'TBD';
                        const team2 = match.team2?.name || match.team2 || 'TBD';
                        const score1 = match.score1 || match.team1?.score || '0';
                        const score2 = match.score2 || match.team2?.score || '0';
                        const tournament = match.tournament?.name || match.league?.name || 'Live матч';
                        
                        return `
                            <div class="match-card live">
                                <div class="match-status">LIVE</div>
                                <div class="match-tournament">
                                    <i class="fas fa-trophy"></i> ${tournament}
                                </div>
                                <div class="match-teams">
                                    <div class="team">
                                        <span class="team-name">${team1}</span>
                                        <span class="team-score">${score1}</span>
                                    </div>
                                    <span class="vs">VS</span>
                                    <div class="team">
                                        <span class="team-name">${team2}</span>
                                        <span class="team-score">${score2}</span>
                                    </div>
                                </div>
                                <div class="match-info">
                                    <span><i class="fas fa-circle" style="color: #ff4444;"></i> LIVE</span>
                                    <a href="https://www.hltv.org/matches" target="_blank" class="match-link">
                                        Смотреть <i class="fas fa-arrow-right"></i>
                                    </a>
                                </div>
                            </div>
                        `;
                    }).join('');

            } catch (error) {
                container.innerHTML = `
                    <div style="grid-column: 1/-1; text-align: center; padding: 60px;">
                        <i class="fas fa-exclamation-triangle" style="font-size: 48px; color: #ff4444;"></i>
                        <p style="margin-top: 20px;">Ошибка загрузки. Перейдите на HLTV напрямую.</p>
                    </div>
                `;
            }
        }

        // Загружаем сразу
        loadMatches();
        
        // Обновляем каждые 30 секунд
        setInterval(loadMatches, 30000);
    </script>
</body>
</html>
