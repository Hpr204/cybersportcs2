<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS2 HUB | Реальные матчи</title>
    
    <!-- Шрифты и иконки -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0a0c0f;
            min-height: 100vh;
            color: #fff;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 30%, rgba(255, 215, 0, 0.05) 0%, transparent 50%),
                        radial-gradient(circle at 80% 70%, rgba(255, 140, 0, 0.05) 0%, transparent 50%),
                        repeating-linear-gradient(45deg, rgba(255, 215, 0, 0.02) 0px, rgba(255, 215, 0, 0.02) 2px, transparent 2px, transparent 10px);
            pointer-events: none;
            z-index: -1;
        }

        .wrapper {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        header {
            background: rgba(10, 12, 15, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            padding: 15px 40px;
            margin: 20px 0 40px 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 20px;
            transition: all 0.3s ease;
        }

        header:hover {
            transform: translateY(-5px);
            border-color: rgba(255, 215, 0, 0.4);
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.6);
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .custom-logo {
            width: 60px;
            height: 60px;
            position: relative;
            margin-right: 5px;
        }

        .logo-circle {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 20px rgba(255, 215, 0, 0.5); }
            50% { box-shadow: 0 0 30px rgba(255, 215, 0, 0.8); }
            100% { box-shadow: 0 0 20px rgba(255, 215, 0, 0.5); }
        }

        .logo-text {
            color: #0a0c0f;
            font-size: 28px;
            font-weight: 900;
            letter-spacing: -2px;
            z-index: 2;
        }

        .logo-highlight {
            color: #fff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        .crosshair {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
        }

        .crosshair::before,
        .crosshair::after {
            content: '';
            position: absolute;
            background: rgba(255, 255, 255, 0.3);
        }

        .crosshair::before {
            width: 2px;
            height: 20px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .crosshair::after {
            width: 20px;
            height: 2px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .logo-ring {
            position: absolute;
            top: -3px;
            left: -3px;
            right: -3px;
            bottom: -3px;
            border: 2px solid transparent;
            border-top: 2px solid #ffd700;
            border-right: 2px solid #ff8c00;
            border-radius: 50%;
            animation: spin 3s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        header h1 {
            font-size: 36px;
            font-weight: 800;
            background: linear-gradient(135deg, #ffd700, #ff8c00, #ffd700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-size: 200% auto;
            animation: shine 3s linear infinite;
            letter-spacing: 2px;
        }

        @keyframes shine {
            to { background-position: 200% center; }
        }

        nav {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            align-items: center;
        }

        nav a {
            text-decoration: none;
            color: #fff;
            font-weight: 500;
            transition: all 0.3s;
            font-size: 16px;
            opacity: 0.7;
            position: relative;
            padding: 5px 0;
        }

        nav a::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, #ffd700, #ff8c00);
            transition: width 0.3s ease;
        }

        nav a:hover {
            opacity: 1;
            color: #ffd700;
        }

        nav a:hover::after {
            width: 100%;
        }

        nav a.active {
            color: #ffd700;
            opacity: 1;
        }

        nav a.active::after {
            width: 100%;
        }

        .page-header {
            text-align: center;
            margin: 40px 0;
        }

        .page-header h2 {
            font-size: 48px;
            font-weight: 800;
            background: linear-gradient(135deg, #ffd700, #ff8c00, #ffd700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-size: 200% auto;
            animation: shine 3s linear infinite;
            margin-bottom: 10px;
        }

        .live-indicator {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 0, 0, 0.1);
            padding: 8px 20px;
            border-radius: 50px;
            margin-top: 15px;
            border: 1px solid rgba(255, 0, 0, 0.3);
            font-size: 14px;
        }

        .live-dot {
            width: 8px;
            height: 8px;
            background: #ff0000;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        .matches-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
            gap: 25px;
            margin: 40px 0;
            min-height: 400px;
        }

        .match-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 25px;
            padding: 25px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }

        .match-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 215, 0, 0.1) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.6s;
            pointer-events: none;
        }

        .match-card:hover::before {
            opacity: 1;
        }

        .match-card:hover {
            transform: translateY(-10px) scale(1.02);
            border-color: rgba(255, 215, 0, 0.3);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .match-card.live {
            border-left: 4px solid #ff4444;
            background: rgba(255, 68, 68, 0.05);
        }

        .match-card.live .match-status {
            position: absolute;
            top: 15px;
            right: 15px;
            background: #ff4444;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            animation: pulse 2s infinite;
        }

        .match-tournament {
            color: #ffd700;
            font-size: 14px;
            margin-bottom: 15px;
            padding-right: 60px;
            font-weight: 500;
        }

        .match-teams {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 20px 0;
        }

        .team {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            width: 40%;
        }

        .team-name {
            font-size: 18px;
            font-weight: 700;
            text-align: center;
            color: #fff;
        }

        .team-score {
            font-size: 32px;
            font-weight: 800;
            color: #ffd700;
        }

        .team-score.placeholder {
            opacity: 0.3;
            font-size: 24px;
        }

        .vs {
            color: rgba(255, 255, 255, 0.3);
            font-weight: 700;
            font-size: 18px;
        }

        .match-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 14px;
            border-top: 1px solid rgba(255, 215, 0, 0.1);
            padding-top: 15px;
        }

        .match-info i {
            color: #ffd700;
            margin-right: 5px;
        }

        .match-link {
            color: #ffd700;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .match-link:hover {
            gap: 10px;
            text-decoration: underline;
        }

        .no-matches {
            grid-column: 1 / -1;
            text-align: center;
            padding: 80px 20px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 30px;
            border: 1px dashed rgba(255, 215, 0, 0.3);
        }

        .no-matches i {
            font-size: 64px;
            color: #ffd700;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .no-matches h3 {
            font-size: 28px;
            color: #fff;
            margin-bottom: 10px;
        }

        .no-matches p {
            color: rgba(255, 255, 255, 0.6);
            font-size: 16px;
            max-width: 500px;
            margin: 0 auto;
            line-height: 1.6;
        }

        .loading {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px;
        }

        .loading i {
            font-size: 48px;
            color: #ffd700;
            margin-bottom: 20px;
        }

        .proxy-warning {
            grid-column: 1 / -1;
            text-align: center;
            padding: 20px;
            background: rgba(255, 165, 0, 0.1);
            border: 1px solid #ffa500;
            border-radius: 15px;
            margin-bottom: 20px;
            color: #ffa500;
            font-size: 14px;
        }

        .proxy-warning i {
            margin-right: 8px;
        }

        footer {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            padding: 40px;
            margin-top: 50px;
            text-align: center;
        }

        footer p {
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 20px;
        }

        .social-links {
            display: flex;
            gap: 25px;
            justify-content: center;
        }

        .social-links a {
            color: rgba(255, 255, 255, 0.6);
            font-size: 24px;
            transition: all 0.3s;
        }

        .social-links a:hover {
            color: #ffd700;
            transform: translateY(-5px);
        }

        @media (max-width: 700px) {
            header {
                flex-direction: column;
                text-align: center;
            }
            nav {
                justify-content: center;
            }
            .page-header h2 {
                font-size: 32px;
            }
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <header>
            <div class="logo-container">
                <div class="custom-logo">
                    <div class="logo-circle">
                        <span class="logo-text">H<span class="logo-highlight">2</span></span>
                        <div class="crosshair"></div>
                    </div>
                    <div class="logo-ring"></div>
                </div>
                <h1>CS2 HUB</h1>
            </div>
            <nav>
                <a href="https://hpr204.github.io/cs2/">Главная</a>
                <a href="https://hpr204.github.io/cs2newsw/">Новости</a>
                <a href="https://hpr204.github.io/Gaidivcs2/">Гайды</a>
                <a href="#" class="active">Live матчи</a>
            </nav>
        </header>

        <div class="page-header">
            <h2>🎯 LIVE МАТЧИ CS2</h2>
            <div class="live-indicator">
                <div class="live-dot"></div>
                <span>Реальные данные с HLTV.org</span>
            </div>
        </div>

        <div id="proxyWarning" style="display: none;" class="proxy-warning">
            <i class="fas fa-exclamation-triangle"></i>
            <span>Прокси-сервер временно недоступен. Показываем команды без счёта. Автоматически восстановится при подключении.</span>
        </div>

        <div id="matchesContainer" class="matches-grid">
            <div class="loading">
                <i class="fas fa-spinner fa-spin"></i>
                <p>Загрузка реальных матчей с HLTV...</p>
            </div>
        </div>

        <footer>
            <p>© 2026 CS2 HUB - Только реальные матчи</p>
            <div class="social-links">
                <a href="#"><i class="fab fa-discord"></i></a>
                <a href="#"><i class="fab fa-telegram"></i></a>
                <a href="#"><i class="fab fa-twitch"></i></a>
                <a href="#"><i class="fab fa-youtube"></i></a>
                <a href="#"><i class="fab fa-steam"></i></a>
            </div>
        </footer>
    </div>

    <script>
        // Массив прокси для надёжности
        const proxies = [
            'https://api.allorigins.win/raw?url=',
            'https://cors-anywhere.herokuapp.com/',
            'https://proxy.cors.sh/',
            'https://api.codetabs.com/v1/proxy/?quest='
        ];

        let currentProxyIndex = 0;
        let updateInterval;
        let proxyWorking = true;
        
        // Реальные команды, которые играют сейчас (будут обновляться с HLTV)
        let currentTeams = [];

        async function loadRealMatches() {
            const container = document.getElementById('matchesContainer');
            const proxyWarning = document.getElementById('proxyWarning');
            
            try {
                const hltvUrl = 'https://www.hltv.org/matches';
                const response = await fetch(proxies[currentProxyIndex] + encodeURIComponent(hltvUrl));
                
                if (!response.ok) {
                    throw new Error(`Прокси ${currentProxyIndex + 1} не работает`);
                }

                const html = await response.text();
                const matches = parseHLTVMatches(html);
                
                // Если прокси работает, скрываем предупреждение
                proxyWarning.style.display = 'none';
                proxyWorking = true;
                
                if (matches.length > 0) {
                    // Есть live матчи со счётом
                    displayMatches(matches, true);
                    // Сохраняем команды для использования при сбое прокси
                    currentTeams = matches.map(m => ({
                        tournament: m.tournament,
                        team1: m.team1,
                        team2: m.team2
                    }));
                } else {
                    // Нет live матчей, показываем сообщение
                    container.innerHTML = showNoMatches();
                }
                
            } catch (error) {
                console.log(`Прокси ${currentProxyIndex + 1} ошибка:`, error);
                
                // Показываем предупреждение о прокси
                proxyWarning.style.display = 'block';
                proxyWorking = false;
                
                // Пробуем следующий прокси
                currentProxyIndex = (currentProxyIndex + 1) % proxies.length;
                
                // Если есть сохранённые команды, показываем их без счёта
                if (currentTeams.length > 0) {
                    displayMatches(currentTeams, false);
                } else {
                    // Если нет сохранённых команд, показываем заглушку
                    container.innerHTML = `
                        <div class="no-matches">
                            <i class="fas fa-plug"></i>
                            <h3>Ожидание подключения</h3>
                            <p>Прокси-сервер временно недоступен. Пробуем переподключиться... (Попытка ${currentProxyIndex + 1}/${proxies.length})</p>
                        </div>
                    `;
                }
            }
        }

        function parseHLTVMatches(html) {
            const parser = new DOMParser();
            const doc = parser.parseFromString(html, 'text/html');
            
            const matches = [];
            
            // Ищем live матчи
            const matchElements = doc.querySelectorAll('.match, .live-match, .matchLive, .match-page');
            
            matchElements.forEach(match => {
                const tournamentElem = match.querySelector('.tournament, .event-name, .league');
                const tournament = tournamentElem ? tournamentElem.textContent.trim() : 'Турнир HLTV';
                
                const teamElems = match.querySelectorAll('.team, .team1, .team2, .opponent');
                const teams = [];
                teamElems.forEach(team => {
                    const name = team.textContent.trim();
                    if (name && name.length > 1 && !name.includes('VS') && !name.includes('vs')) {
                        teams.push(name);
                    }
                });
                
                const scoreElems = match.querySelectorAll('.score, .result, .team-score');
                const scores = [];
                scoreElems.forEach(score => {
                    const val = score.textContent.trim();
                    if (val && !isNaN(parseInt(val))) {
                        scores.push(val);
                    }
                });
                
                const isLive = match.classList.contains('live') || 
                              match.querySelector('.live') || 
                              match.innerHTML.includes('LIVE') ||
                              match.innerHTML.includes('live');
                
                if (teams.length >= 2 && isLive) {
                    matches.push({
                        tournament: tournament,
                        team1: teams[0],
                        team2: teams[1],
                        score1: scores[0] || '0',
                        score2: scores[1] || '0',
                        isLive: true
                    });
                }
            });
            
            return matches;
        }

        function displayMatches(matches, hasScore) {
            const container = document.getElementById('matchesContainer');

            let html = '';

            if (matches.length > 0) {
                html += `
                    <div style="grid-column: 1/-1; margin-bottom: 20px;">
                        <h3 style="color: #ffd700; display: flex; align-items: center; gap: 10px;">
                            <i class="fas fa-circle" style="color: #ff4444;"></i> 
                            LIVE МАТЧИ (${matches.length})
                            ${!hasScore ? '<span style="font-size: 12px; color: #ffa500; margin-left: 10px;">(без счёта)</span>' : ''}
                        </h3>
                    </div>
                `;

                matches.forEach(match => {
                    html += `
                        <div class="match-card live">
                            <div class="match-status">LIVE</div>
                            <div class="match-tournament">
                                <i class="fas fa-trophy"></i> ${match.tournament}
                            </div>
                            <div class="match-teams">
                                <div class="team">
                                    <span class="team-name">${match.team1}</span>
                                    ${hasScore ? 
                                        `<span class="team-score">${match.score1}</span>` : 
                                        `<span class="team-score placeholder">?</span>`
                                    }
                                </div>
                                <span class="vs">VS</span>
                                <div class="team">
                                    <span class="team-name">${match.team2}</span>
                                    ${hasScore ? 
                                        `<span class="team-score">${match.score2}</span>` : 
                                        `<span class="team-score placeholder">?</span>`
                                    }
                                </div>
                            </div>
                            <div class="match-info">
                                <span>
                                    <i class="fas fa-circle" style="color: #ff4444;"></i> 
                                    ${hasScore ? 'LIVE' : 'Ожидание счёта...'}
                                </span>
                                <a href="https://www.hltv.org/matches" target="_blank" class="match-link">
                                    Смотреть на HLTV <i class="fas fa-external-link-alt"></i>
                                </a>
                            </div>
                        </div>
                    `;
                });
            } else {
                html = showNoMatches();
            }

            container.innerHTML = html;
        }

        function showNoMatches() {
            return `
                <div class="no-matches">
                    <i class="fas fa-info-circle"></i>
                    <h3>Нет live матчей</h3>
                    <p>На данный момент на HLTV.org нет активных live матчей. Как только матчи начнутся, они появятся здесь автоматически.</p>
                    <p style="margin-top: 20px; font-size: 14px; color: #ffd700;">
                        <i class="fas fa-sync-alt"></i> Страница обновляется каждые 30 секунд
                    </p>
                </div>
            `;
        }

        // Запускаем загрузку
        loadRealMatches();
        
        // Обновляем каждые 30 секунд
        if (updateInterval) clearInterval(updateInterval);
        updateInterval = setInterval(loadRealMatches, 30000);
    </script>
</body>
</html>
